<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      内联 SVG 图标：避免额外静态资源请求，也避免 favicon.ico 404 污染控制台
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234361ee'/%3E%3Ccircle cx='16' cy='13' r='5' fill='white'/%3E%3Cpath d='M6 28c0-5.5 4.5-9 10-9s10 3.5 10 9z' fill='white'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="人脸采集与识别系统前端，基于 Vue3 + Vite，对接 FastAPI 人脸识别接口" />
    <title>人脸采集与识别系统</title>
  </head>
  <body>
    <!-- Vue 应用挂载点，由 src/main.js 接管 -->
    <div id="app"></div>

    <!-- 入口脚本：type="module" 让 Vite 接管模块解析与热更新 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
